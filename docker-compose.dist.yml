# Distribuição — rodar em OUTRO computador, sem o código-fonte (app + postgres, TLS no app).
#
# Um compose NÃO gera .tar: ele só constrói/tagueia as imagens. O .tar sai de `docker save`,
# que o script scripts/build-dist.sh (macOS/Linux) ou build-dist.ps1 (Windows) executa depois do build deste arquivo.
#
# Este arquivo serve aos dois lados:
#   Máquina de build (repositório):  ./scripts/build-dist.sh --version 1.0.0   (Windows: .\scripts\build-dist.ps1 -Version 1.0.0)
#       → docker compose build  +  docker save  →  dist/ (tar + este compose + schema.sql + .env.example)
#   Máquina de destino (só a pasta dist/):  docker load -i mcp-analysis-<versão>.tar
#       → cp .env.example .env  (preencher)  →  docker compose up -d      (ver INSTALL.md gerado)
#
# O script copia este arquivo como dist/docker-compose.yml. No destino não existe Dockerfile:
# `pull_policy: never` garante que o compose use só a imagem carregada pelo `docker load`
# (e nunca tente baixar "mcp-analysis" do Docker Hub). Se a imagem não estiver carregada, o
# `up` falha com "No such image" — rode o `docker load` primeiro.
#
# Para ambiente com nginx/Let's Encrypt use docker-compose.remote.yml (precisa do repositório).

name: mcp-analysis

services:
  app:
    build:
      context: .   # só usado na máquina de build (raiz do repositório)
    image: ${APP_IMAGE:-mcp-analysis}:${APP_VERSION:-1.0.0}
    pull_policy: never
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      TLS_ENABLED: ${TLS_ENABLED:-true}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-certs/server.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-certs/server-key.pem}
      # Dentro do compose o Config DB é o serviço "postgres" (não "localhost")
      POSTGRES_CONFIG_HOST: postgres
      POSTGRES_CONFIG_PORT: 5432
      POSTGRES_CONFIG_DATABASE: ${POSTGRES_CONFIG_DATABASE:-analysis_config}
      POSTGRES_CONFIG_USER: ${POSTGRES_CONFIG_USER:-postgres}
      POSTGRES_CONFIG_PASSWORD: ${POSTGRES_CONFIG_PASSWORD:?defina POSTGRES_CONFIG_PASSWORD no .env}
      FERNET_KEY: ${FERNET_KEY:?defina FERNET_KEY no .env}
      DEFAULT_MAX_RESULT_ROWS: ${DEFAULT_MAX_RESULT_ROWS:-500}
      DEFAULT_MAX_RESULT_SIZE_KB: ${DEFAULT_MAX_RESULT_SIZE_KB:-150}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS:-30}
      QUERY_RETRY_MAX_ATTEMPTS: ${QUERY_RETRY_MAX_ATTEMPTS:-3}
      QUERY_RETRY_BACKOFF_BASE_MS: ${QUERY_RETRY_BACKOFF_BASE_MS:-200}
      PG_POOL_MIN_SIZE: ${PG_POOL_MIN_SIZE:-10}
      PG_POOL_MAX_SIZE: ${PG_POOL_MAX_SIZE:-10}
      CONFIG_DB_POOL_MIN_SIZE: ${CONFIG_DB_POOL_MIN_SIZE:-10}
      CONFIG_DB_POOL_MAX_SIZE: ${CONFIG_DB_POOL_MAX_SIZE:-10}
      CACHE_BACKEND: ${CACHE_BACKEND:-memory}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-200}
      CACHE_MAX_SIZE_MB: ${CACHE_MAX_SIZE_MB:-100}
      ACCESS_TOKEN_EXPIRATION_DAYS: ${ACCESS_TOKEN_EXPIRATION_DAYS:-90}
      ACCESS_TOKEN_MAX_EXPIRATION_DAYS: ${ACCESS_TOKEN_MAX_EXPIRATION_DAYS:-365}
    volumes:
      # Certificados entram só em runtime, nunca na imagem
      - ./certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: ${POSTGRES_CONFIG_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_CONFIG_PASSWORD:?defina POSTGRES_CONFIG_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_CONFIG_DATABASE:-analysis_config}
      # Lidos só pelo seed_admin.sh (initdb.d); SENHA PADRÃO CONHECIDA — troque antes de expor o servidor.
      # Senha com "$" no .env precisa ser escrita "$$" (interpolação do compose).
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Senh@123}
    ports:
      # 5433 por padrão para não colidir com um PostgreSQL já instalado no host
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql fica ao lado deste arquivo (o script o copia de src/database/). Roda uma única
      # vez, com o volume vazio; num banco já existente é preciso aplicar as mudanças à mão.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Cria o admin (perfil + usuário + vínculos) na criação do banco; o script copia este arquivo
      # de src/database/seed_admin.sh. Reexecutável à mão com setup-admin.ps1.
      - ./seed_admin.sh:/docker-entrypoint-initdb.d/02-seed-admin.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
